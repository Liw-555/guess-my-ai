<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Telescope body -->
  <rect x="180" y="120" width="150" height="40" fill="#4A5568" rx="5"/>
  <rect x="330" y="125" width="40" height="30" fill="#2D3748" rx="3"/>
  <circle cx="370" cy="140" r="12" fill="#1A202C"/>
  
  <!-- Telescope mount -->
  <rect x="240" y="160" width="30" height="80" fill="#718096"/>
  <rect x="230" y="240" width="50" height="10" fill="#4A5568"/>
  
  <!-- Flamingo body -->
  <ellipse cx="100" cy="140" rx="45" ry="35" fill="#FF69B4"/>
  
  <!-- Flamingo neck -->
  <path d="M 100 140 Q 90 100 80 80 Q 70 60 75 40" stroke="#FF69B4" stroke-width="18" fill="none"/>
  
  <!-- Flamingo head -->
  <ellipse cx="75" cy="35" rx="20" ry="18" fill="#FF69B4"/>
  
  <!-- Flamingo beak -->
  <path d="M 55 35 L 45 40 L 48 45 L 58 38 Z" fill="#2C2C2C"/>
  <path d="M 48 45 L 50 50 L 58 44 L 58 38 Z" fill="#FF6B6B"/>
  
  <!-- Flamingo eye -->
  <circle cx="70" cy="32" r="3" fill="#000000"/>
  <circle cx="71" cy="31" r="1" fill="#FFFFFF"/>
  
  <!-- Flamingo legs -->
  <line x1="85" y1="170" x2="80" y2="220" stroke="#FF1493" stroke-width="4"/>
  <line x1="115" y1="170" x2="110" y2="220" stroke="#FF1493" stroke-width="4"/>
  
  <!-- Flamingo feet -->
  <path d="M 80 220 L 75 225 M 80 220 L 85 225 M 80 220 L 80 227" stroke="#FF1493" stroke-width="3" fill="none"/>
  <path d="M 110 220 L 105 225 M 110 220 L 115 225 M 110 220 L 110 227" stroke="#FF1493" stroke-width="3" fill="none"/>
  
  <!-- Flamingo wing (holding wrench) -->
  <ellipse cx="130" cy="130" rx="25" ry="15" fill="#FF69B4" transform="rotate(25 130 130)"/>
  
  <!-- Wrench -->
  <rect x="135" y="115" width="8" height="40" fill="#808080" transform="rotate(30 139 135)"/>
  <circle cx="150" cy="108" r="10" fill="none" stroke="#808080" stroke-width="8"/>
  <path d="M 150 108 L 160 100" stroke="#808080" stroke-width="8"/>
  
  <!-- Screws on ground -->
  <circle cx="200" cy="245" r="3" fill="#696969"/>
  <circle cx="210" cy="248" r="3" fill="#696969"/>
</svg>