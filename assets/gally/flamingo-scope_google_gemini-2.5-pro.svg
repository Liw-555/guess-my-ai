<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="500" height="500" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Flamingo Repairing a Telescope</title>
  <desc id="svgDesc">A whimsical cartoon illustration of a pink flamingo standing on one leg. It is holding a screwdriver in its beak and appears to be repairing a large blue telescope mounted on a gray tripod.</desc>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#E0F7FA" />
  
  <!-- Ground -->
  <path d="M 0 180 C 40 175, 160 185, 200 180 L 200 200 L 0 200 Z" fill="#F0EAD6" stroke="#D2B48C" stroke-width="0.5"/>

  <!-- Telescope -->
  <g id="telescope" transform="translate(10, 25)">
    <!-- Tripod -->
    <g id="tripod" fill="#8D99AE" stroke="#2B3A42" stroke-width="0.75">
      <path d="M 60 100 L 40 155" /> <!-- Left Leg -->
      <path d="M 65 100 L 85 155" /> <!-- Right Leg -->
      <path d="M 62.5 100 L 62.5 145" /> <!-- Middle Leg (behind) -->
      <circle cx="62.5" cy="100" r="5" fill="#BCCCDC" /> <!-- Mount Base -->
    </g>
    
    <!-- Telescope Body -->
    <g id="telescope-body" transform="rotate(-30 65 90)">
      <rect x="10" y="80" width="100" height="20" rx="5" ry="5" fill="#2E4057" stroke="#1C2833" stroke-width="1.5" />
      <rect x="110" y="82" width="10" height="16" rx="2" ry="2" fill="#4A6572" stroke="#1C2833" stroke-width="1"/>
      <rect x="5" y="85" width="5" height="10" rx="1" ry="1" fill="#4A6572" stroke="#1C2833" stroke-width="1"/>
    </g>

    <!-- Mount and Screw -->
    <g id="mount-joint">
       <circle cx="68" cy="93" r="7" fill="#BCCCDC" stroke="#2B3A42" stroke-width="1"/>
       <circle cx="68" cy="93" r="3" fill="#8D99AE" />
       <!-- Screw Head -->
       <rect x="66" y="91" width="4" height="4" fill="#4A6572"/>
    </g>
  </g>

  <!-- Flamingo -->
  <g id="flamingo">
    <!-- Legs -->
    <g id="flamingo-legs" stroke-width="3" stroke="#F8BBD0" stroke-linecap="round">
      <path d="M 140 120 L 140 180" /> <!-- Standing Leg -->
      <path d="M 140 145 Q 130 150 135 160" /> <!-- Bent Leg -->
      <circle cx="140" cy="150" r="2.5" fill="#F48FB1"/> <!-- Knee joint -->
    </g>
    
    <!-- Body -->
    <path id="flamingo-body" d="M 125 90 C 110 110, 130 135, 155 130 C 180 125, 175 90, 150 85 C 135 80, 130 80, 125 90 Z" fill="#F48FB1" stroke="#E91E63" stroke-width="1.5"/>
    
    <!-- Neck and Head -->
    <path id="flamingo-neck" d="M 130 90 C 120 70, 100 80, 100 100" fill="none" stroke="#F48FB1" stroke-width="6" stroke-linecap="round"/>
    <circle id="flamingo-head" cx="100" cy="103" r="6" fill="#F8BBD0" stroke="#E91E63" stroke-width="1"/>
    
    <!-- Beak -->
    <g id="flamingo-beak" transform="translate(85, 99) rotate(20)">
      <path d="M 0 0 C 10 -5, 12 5, 20 2 L 18 5 C 10 8, 5 2, 0 0 Z" fill="#FDFDFD" stroke="#444" stroke-width="0.5"/>
      <path d="M 15 2.8 C 17 2, 20 2, 20 2 L 18 5 C 17 4.5, 16 3.5 15 2.8 Z" fill="#212121"/>
    </g>
    
    <!-- Eye -->
    <circle cx="102" cy="101" r="1" fill="#212121"/>
  </g>

  <!-- Screwdriver -->
  <g id="screwdriver" transform="translate(80, 93) rotate(-10)">
      <!-- Shaft -->
      <rect x="0" y="0" width="15" height="1.5" fill="#A9A9A9" stroke="#666" stroke-width="0.5"/>
      <!-- Handle -->
      <rect x="15" y="-2" width="10" height="5.5" rx="2" ry="2" fill="#D90429" stroke="#8F001A" stroke-width="0.75"/>
  </g>
</svg>