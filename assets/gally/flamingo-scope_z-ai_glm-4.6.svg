<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f0f4f8"/>
  
  <!-- Workbench -->
  <rect x="50" y="280" width="300" height="80" fill="#8b6f47" rx="3"/>
  <rect x="50" y="280" width="300" height="10" fill="#6d5638"/>
  
  <!-- Telescope main body -->
  <g transform="rotate(-30, 200, 250)">
    <!-- Main tube -->
    <rect x="160" y="240" width="80" height="25" fill="#c4a57b" rx="2"/>
    <rect x="160" y="240" width="80" height="8" fill="#8b7355"/>
    
    <!-- Objective lens -->
    <circle cx="245" cy="252.5" r="15" fill="#4a90e2" opacity="0.3"/>
    <circle cx="245" cy="252.5" r="12" fill="none" stroke="#6d5638" stroke-width="2"/>
    
    <!-- Eyepiece -->
    <rect x="145" y="247" width="20" height="10" fill="#2c3e50"/>
    <circle cx="145" cy="252" r="6" fill="#34495e"/>
    
    <!-- Mount rings -->
    <rect x="180" y="238" width="40" height="4" fill="#6d5638"/>
    <rect x="180" y="262" width="40" height="4" fill="#6d5638"/>
    
    <!-- Tripod mount -->
    <rect x="190" y="265" width="20" height="15" fill="#8b7355"/>
  </g>
  
  <!-- Flamingo -->
  <g transform="translate(200, 200)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="35" ry="45" fill="#ff69b4"/>
    <ellipse cx="-5" cy="15" rx="25" ry="35" fill="#ff85c1"/>
    
    <!-- Neck -->
    <path d="M -10 -10 Q -15 -35, -10 -60 Q -5 -75, 5 -85" 
          stroke="#ff69b4" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- Head -->
    <ellipse cx="5" cy="-85" rx="15" ry="12" fill="#ff69b4"/>
    
    <!-- Beak -->
    <path d="M 15 -85 L 28 -83 L 30 -87 L 15 -89 Z" fill="#2c3e50"/>
    <circle cx="28" cy="-85" r="2" fill="#1a1a1a"/>
    
    <!-- Eye -->
    <circle cx="8" cy="-86" r="3" fill="white"/>
    <circle cx="9" cy="-86" r="2" fill="black"/>
    
    <!-- Wing (holding tool) -->
    <ellipse cx="20" cy="20" rx="20" ry="30" fill="#ff85c1" transform="rotate(30 20 20)"/>
    
    <!-- Standing leg -->
    <rect x="-3" y="60" width="6" height="80" fill="#ff69b4"/>
    <path d="M 0 140 L -5 145 L 0 150 L 5 145 Z" fill="#ff69b4"/>
    
    <!-- Bent leg -->
    <path d="M 5 60 Q 20 70, 15 85 Q 10 90, 5 95" 
          stroke="#ff69b4" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Tools on workbench -->
  <!-- Screwdriver -->
  <g transform="translate(100, 260)">
    <rect x="0" y="0" width="4" height="25" fill="#c0c0c0"/>
    <rect x="-2" y="25" width="8" height="8" fill="#8b4513"/>
    <rect x="-1" y="-3" width="2" height="5" fill="#696969"/>
  </g>
  
  <!-- Wrench -->
  <g transform="translate(130, 265)">
    <rect x="0" y="0" width="3" height="20" fill="#c0c0c0"/>
    <path d="M -3 -2 L 3 -2 L 3 2 L -3 2 Z" fill="#c0c0c0"/>
    <circle cx="0" cy="0" r="3" fill="none" stroke="#c0c0c0" stroke-width="2"/>
  </g>
  
  <!-- Small screws -->
  <circle cx="280" cy="270" r="3" fill="#696969"/>
  <circle cx="290" cy="272" r="3" fill="#696969"/>
  <circle cx="285" cy="278" r="3" fill="#696969"/>
  
  <!-- Magnifying glass in flamingo's wing -->
  <g transform="translate(220, 215) rotate(-20)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#8b4513" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#87ceeb" opacity="0.3"/>
    <rect x="10" y="8" width="3" height="15" fill="#8b4513" transform="rotate(45 10 8)"/>
  </g>
  
  <!-- Small sparkles to show work in progress -->
  <g transform="translate(250, 200)">
    <path d="M 0 -5 L 0 5 M -5 0 L 5 0" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(270, 220)">
    <path d="M 0 -3 L 0 3 M -3 0 L 3 0" stroke="#ffd700" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Oil can -->
  <g transform="translate(300, 250)">
    <ellipse cx="0" cy="5" rx="8" ry="10" fill="#2c3e50"/>
    <rect x="-3" y="-5" width="6" height="10" fill="#2c3e50"/>
    <path d="M 3 -3 Q 8 -2, 10 0" stroke="#2c3e50" stroke-width="2" fill="none"/>
    <circle cx="0" cy="5" r="3" fill="#1a1a1a"/>
  </g>
</svg>