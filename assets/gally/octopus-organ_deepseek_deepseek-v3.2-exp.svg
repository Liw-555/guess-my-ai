<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a237e"/>
  
  <!-- Pipe Organ -->
  <rect x="80" y="150" width="240" height="180" fill="#5d4037"/>
  <rect x="100" y="130" width="200" height="20" fill="#4e342e"/>
  
  <!-- Organ Pipes -->
  <rect x="90" y="80" width="15" height="70" fill="#e0e0e0"/>
  <rect x="110" y="60" width="15" height="90" fill="#e0e0e0"/>
  <rect x="130" y="40" width="15" height="110" fill="#e0e0e0"/>
  <rect x="150" y="30" width="15" height="120" fill="#e0e0e0"/>
  <rect x="170" y="20" width="15" height="130" fill="#e0e0e0"/>
  <rect x="190" y="30" width="15" height="120" fill="#e0e0e0"/>
  <rect x="210" y="40" width="15" height="110" fill="#e0e0e0"/>
  <rect x="230" y="60" width="15" height="90" fill="#e0e0e0"/>
  <rect x="250" y="80" width="15" height="70" fill="#e0e0e0"/>
  
  <rect x="270" y="100" width="12" height="50" fill="#e0e0e0"/>
  <rect x="285" y="110" width="10" height="40" fill="#e0e0e0"/>
  <rect x="298" y="120" width="8" height="30" fill="#e0e0e0"/>
  
  <!-- Keyboard -->
  <rect x="100" y="250" width="200" height="30" fill="#212121"/>
  
  <!-- White Keys -->
  <rect x="105" y="250" width="18" height="30" fill="#f5f5f5"/>
  <rect x="125" y="250" width="18" height="30" fill="#f5f5f5"/>
  <rect x="145" y="250" width="18" height="30" fill="#f5f5f5"/>
  <rect x="165" y="250" width="18" height="30" fill="#f5f5f5"/>
  <rect x="185" y="250" width="18" height="30" fill="#f5f5f5"/>
  <rect x="205" y="250" width="18" height="30" fill="#f5f5f5"/>
  <rect x="225" y="250" width="18" height="30" fill="#f5f5f5"/>
  <rect x="245" y="250" width="18" height="30" fill="#f5f5f5"/>
  <rect x="265" y="250" width="18" height="30" fill="#f5f5f5"/>
  
  <!-- Black Keys -->
  <rect x="118" y="250" width="12" height="18" fill="#212121"/>
  <rect x="138" y="250" width="12" height="18" fill="#212121"/>
  <rect x="158" y="250" width="12" height="18" fill="#212121"/>
  <rect x="198" y="250" width="12" height="18" fill="#212121"/>
  <rect x="218" y="250" width="12" height="18" fill="#212121"/>
  <rect x="238" y="250" width="12" height="18" fill="#212121"/>
  <rect x="278" y="250" width="12" height="18" fill="#212121"/>
  
  <!-- Octopus Body -->
  <circle cx="200" cy="220" r="25" fill="#3f51b5"/>
  
  <!-- Octopus Tentacles on Keyboard -->
  <path d="M185 245 Q175 260, 165 280 T145 320" stroke="#3f51b5" stroke-width="8" fill="none"/>
  <path d="M190 245 Q185 260, 180 280 T170 320" stroke="#3f51b5" stroke-width="8" fill="none"/>
  <path d="M195 245 Q195 260, 195 280 T195 320" stroke="#3f51b5" stroke-width="8" fill="none"/>
  <path d="M200 245 Q205 260, 210 280 T220 320" stroke="#3f51b5" stroke-width="8" fill="none"/>
  <path d="M205 245 Q215 260, 225 280 T245 320" stroke="#3f51b5" stroke-width="8" fill="none"/>
  <path d="M210 245 Q220 260, 230 280 T250 320" stroke="#3f51b5" stroke-width="8" fill="none"/>
  <path d="M215 245 Q230 260, 245 280 T265 320" stroke="#3f51b5" stroke-width="8" fill="none"/>
  
  <!-- Octopus Eyes -->
  <circle cx="190" cy="215" r="6" fill="#ffffff"/>
  <circle cx="210" cy="215" r="6" fill="#ffffff"/>
  <circle cx="190" cy="215" r="3" fill="#000000"/>
  <circle cx="210" cy="215" r="3" fill="#000000"/>
  
  <!-- Music Notes -->
  <g fill="#ffeb3b">
    <circle cx="320" cy="100" r="5"/>
    <path d="M320 100 L320 80 Q325 75, 330 80 L330 60" stroke="#ffeb3b" stroke-width="3" fill="none"/>
  </g>
  
  <g fill="#ffeb3b">
    <circle cx="340" cy="120" r="5"/>
    <path d="M340 120 L340 100 Q345 95, 350 100 L350 80" stroke="#ffeb3b" stroke-width="3" fill="none"/>
  </g>
  
  <g fill="#ffeb3b">
    <circle cx="360" cy="80" r="5"/>
    <path d="M360 80 L360 60 Q365 55, 370 60 L370 40" stroke="#ffeb3b" stroke-width="3" fill="none"/>
  </g>
