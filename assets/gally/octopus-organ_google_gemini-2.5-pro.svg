<svg width="600" height="600" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title" role="img">
  <title id="title">An octopus playing a pipe organ</title>

  <style>
    .organ-wood { fill: #8B4513; }
    .organ-pipe { fill: #C0C0C0; stroke: #A9A9A9; stroke-width: 1; }
    .key-white { fill: #FFFFFF; stroke: #333; }
    .key-black { fill: #222222; }
    .octopus-body { fill: #D95B43; }
    .octopus-sucker { fill: #F0A38E; }
    .octopus-eye { fill: #FFFFFF; }
    .octopus-pupil { fill: #000000; }
  </style>

  <!-- Background -->
  <rect width="500" height="500" fill="#F0F8FF" />

  <!-- ORGAN -->
  <g id="organ">
    <!-- Pipes -->
    <g id="organ-pipes">
      <rect x="50" y="50" width="20" height="250" class="organ-pipe" />
      <rect x="80" y="40" width="20" height="280" class="organ-pipe" />
      <rect x="110" y="30" width="20" height="300" class="organ-pipe" />
      <rect x="140" y="25" width="20" height="310" class="organ-pipe" />
      <rect x="170" y="20" width="25" height="320" class="organ-pipe" />
      <rect x="205" y="15" width="25" height="330" class="organ-pipe" />
      <rect x="240" y="10" width="25" height="340" class="organ-pipe" />
      <rect x="275" y="15" width="25" height="330" class="organ-pipe" />
      <rect x="310" y="20" width="25" height="320" class="organ-pipe" />
      <rect x="340" y="25" width="20" height="310" class="organ-pipe" />
      <rect x="370" y="30" width="20" height="300" class="organ-pipe" />
      <rect x="400" y="40" width="20" height="280" class="organ-pipe" />
      <rect x="430" y="50" width="20" height="250" class="organ-pipe" />
    </g>

    <!-- Console -->
    <rect x="40" y="300" width="420" height="150" class="organ-wood" rx="10"/>

    <!-- Keyboards -->
    <rect x="100" y="320" width="300" height="25" class="key-white" />
    <rect x="100" y="355" width="300" height="25" class="key-white" />
    
    <!-- Black Keys (Upper) -->
    <rect x="115" y="320" width="10" height="15" class="key-black"/>
    <rect x="135" y="320" width="10" height="15" class="key-black"/>
    <rect x="165" y="320" width="10" height="15" class="key-black"/>
    <rect x="185" y="320" width="10" height="15" class="key-black"/>
    <rect x="205" y="320" width="10" height="15" class="key-black"/>
    <rect x="235" y="320" width="10" height="15" class="key-black"/>
    <rect x="255" y="320" width="10" height="15" class="key-black"/>
    <rect x="285" y="320" width="10" height="15" class="key-black"/>
    <rect x="305" y="320" width="10" height="15" class="key-black"/>
    <rect x="325" y="320" width="10" height="15" class="key-black"/>
    <rect x="355" y="320" width="10" height="15" class="key-black"/>
    <rect x="375" y="320" width="10" height="15" class="key-black"/>

    <!-- Black Keys (Lower) -->
    <rect x="125" y="355" width="10" height="15" class="key-black"/>
    <rect x="145" y="355" width="10" height="15" class="key-black"/>
    <rect x="175" y="355" width="10" height="15" class="key-black"/>
    <rect x="195" y="355" width="10" height="15" class="key-black"/>
    <rect x="215" y="355" width="10" height="15" class="key-black"/>
    <rect x="245" y="355" width="10" height="15" class="key-black"/>
    <rect x="265" y="355" width="10" height="15" class="key-black"/>
    <rect x="295" y="355" width="10" height="15" class="key-black"/>
    <rect x="315" y="355" width="10" height="15" class="key-black"/>
    <rect x="335" y="355" width="10" height="15" class="key-black"/>

    <!-- Stops -->
    <circle cx="70" cy="330" r="8" class="organ-wood" stroke="#4a2a0c" stroke-width="2"/>
    <circle cx="70" cy="355" r="8" class="organ-wood" stroke="#4a2a0c" stroke-width="2"/>
    <circle cx="70" cy="380" r="8" class="organ-wood" stroke="#4a2a0c" stroke-width="2"/>
    <circle cx="430" cy="330" r="8" class="organ-wood" stroke="#4a2a0c" stroke-width="2"/>
    <circle cx="430" cy="355" r="8" class="organ-wood" stroke="#4a2a0c" stroke-width="2"/>
    <circle cx="430" cy="380" r="8" class="organ-wood" stroke="#4a2a0c" stroke-width="2"/>

    <!-- Pedalboard -->
    <g id="pedalboard" transform="translate(150, 450) skewX(-20)">
        <rect x="0" y="0" width="200" height="40" class="organ-wood" />
        <rect x="10" y="5" width="10" height="30" class="key-black" />
        <rect x="30" y="5" width="10" height="30" class="key-black" />
        <rect x="50" y="5" width="10" height="30" class="key-black" />
        <rect x="70" y="5" width="10" height="30" class="key-black" />
        <rect x="90" y="5" width="10" height="30" class="key-black" />
        <rect x="110" y="5" width="10" height="30" class="key-black" />
        <rect x="130" y="5" width="10" height="30" class="key-black" />
        <rect x="150" y="5" width="10" height="30" class="key-black" />
        <rect x="170" y="5" width="10" height="30" class="key-black" />
    </g>
  </g>

  <!-- OCTOPUS -->
  <g id="octopus">
    <!-- Tentacles (drawn first to be behind the body) -->
    <g class="octopus-body" stroke-width="4" stroke="#c0402c">
        <!-- Tentacle on Pedal 1 -->
        <path d="M 200 400 Q 180 430, 200 460" fill="none" />
        <!-- Tentacle on Pedal 2 -->
        <path d="M 300 400 Q 320 430, 300 460" fill="none" />
        <!-- Tentacle on Lower Keyboard 1 -->
        <path d="M 220 310 Q 180 340, 160 365" fill="none" />
        <!-- Tentacle on Lower Keyboard 2 -->
        <path d="M 280 310 Q 320 340, 340 365" fill="none" />
        <!-- Tentacle on Upper Keyboard 1 -->
        <path d="M 230 290 Q 200 300, 190 330" fill="none" />
        <!-- Tentacle on Upper Keyboard 2 -->
        <path d="M 270 290 Q 300 300, 310 330" fill="none" />
        <!-- Tentacle pulling stop -->
        <path d="M 180 280 Q 100 300, 78 355" fill="none" />
        <!-- Waving tentacle -->
        <path d="M 320 280 Q 390 300, 380 250" fill="none" />
    </g>

    <!-- Octopus Body (Mantle) -->
    <path d="M 250 180 C 180 180, 150 240, 150 280 C 150 350, 350 350, 350 280 C 350 240, 320 180, 250 180 Z" class="octopus-body" />
    
    <!-- Octopus Eyes -->
    <circle cx="220" cy="260" r="25" class="octopus-eye"/>
    <circle cx="280" cy="260" r="25" class="octopus-eye"/>
    <circle cx="225" cy="265" r="10" class="octopus-pupil"/>
    <circle cx="285" cy="265" r="10" class="octopus-pupil"/>
    <circle cx="228" cy="262" r="3" fill="white"/>
    <circle cx="288" cy="262" r="3" fill="white"/>
  </g>

</svg>