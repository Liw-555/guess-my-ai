  <rect x="60" y="50" width="20" height="100" fill="#C0C0C0" stroke="#A9A9A9"/>
  <rect x="85" y="40" width="15" height="110" fill="#D3D3D3" stroke="#B0B0B0"/>
  <rect x="105" y="30" width="10" height="120" fill="#E0E0E0" stroke="#C0C0C0"/>
  <rect x="120" y="35" width="12" height="115" fill="#C0C0C0" stroke="#A9A9A9"/>
  <rect x="135" y="45" width="18" height="105" fill="#D3D3D3" stroke="#B0B0B0"/>
  <rect x="158" y="25" width="8" height="125" fill="#E0E0E0" stroke="#C0C0C0"/>
  <!-- Keyboard -->
  <rect x="60" y="160" width="160" height="20" fill="#FFFFFF" stroke="#000000"/>
  <!-- Keys (simplified) -->
  <rect x="65" y="160" width="8" height="20" fill="#000000"/>
  <rect x="75" y="160" width="8" height="20" fill="#FFFFFF" stroke="#000000"/>
  <rect x="85" y="160" width="8" height="20" fill="#000000"/>
  <rect x="95" y="160" width="8" height="20" fill="#FFFFFF" stroke="#000000"/>
  <rect x="105" y="160" width="8" height="20" fill="#000000"/>
  <rect x="115" y="160" width="8" height="20" fill="#FFFFFF" stroke="#000000"/>
  <rect x="125" y="160" width="8" height="20" fill="#000000"/>
  <rect x="135" y="160" width="8" height="20" fill="#FFFFFF" stroke="#000000"/>
  <rect x="145" y="160" width="8" height="20" fill="#000000"/>
  <rect x="155" y="160" width="8" height="20" fill="#FFFFFF" stroke="#000000"/>
  <rect x="165" y="160" width="8" height="20" fill="#000000"/>
  <!-- Pedals -->
  <rect x="180" y="240" width="80" height="10" fill="#FFFFFF" stroke="#000000"/>
  <rect x="185" y="240" width="10" height="10" fill="#000000"/>
  <rect x="200" y="240" width="10" height="10" fill="#FFFFFF" stroke="#000000"/>
  <rect x="215" y="240" width="10" height="10" fill="#000000"/>
  <!-- Octopus Body -->
  <ellipse cx="275" cy="200" rx="30" ry="25" fill="#FF8C00"/>
  <!-- Eyes -->
  <circle cx="265" cy="190" r="5" fill="#000000"/>
  <circle cx="285" cy="190" r="5" fill="#000000"/>
  <!-- Tentacles -->
  <path d="M250 200 Q230 180 220 150" stroke="#FF8C00" stroke-width="5" fill="none"/>
  <path d="M255 215 Q240 230 230 250" stroke="#FF8C00" stroke-width="5" fill="none"/>
  <path d="M270 225 Q280 240 290 260" stroke="#FF8C00" stroke-width="5" fill="none"/>
  <path d="M285 215 Q305 235 315 255" stroke="#FF8C00" stroke-width="5" fill="none"/>
  <path d="M290 200 Q310 185 325 165" stroke="#FF8C00" stroke-width="5" fill="none"/>
  <path d="M265 185 Q260 165 250 145" stroke="#FF8C00" stroke-width="5" fill="none"/>
  <!-- Operating Keys and Pedals (tentacles on keyboard and pedals) -->
  <path d="M255 205 Q200 175 140 175" stroke="#FF8C00" stroke-width="5" fill="none"/>
  <path d="M265 210 Q220 225 220 240" stroke="#FF8C00" stroke-width="5" fill="none"/>
