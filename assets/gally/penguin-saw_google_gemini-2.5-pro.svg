<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title" role="img">
  <title id="title">A cartoon penguin juggling three chainsaws.</title>

  <!-- Define a reusable chainsaw element -->
  <defs>
    <g id="chainsaw">
      <!-- Chainsaw body -->
      <rect x="-40" y="-15" width="55" height="30" rx="5" fill="#E53935" stroke="#BF360C" stroke-width="2"/>
      <!-- Handle -->
      <path d="M -30 -15 Q 0 -45 25 -15" fill="none" stroke="#424242" stroke-width="6" stroke-linecap="round"/>
      <!-- Blade bar -->
      <rect x="15" y="-5" width="80" height="10" rx="3" fill="#BDBDBD" stroke="#757575" stroke-width="1"/>
      <!-- Chain teeth -->
      <path d="M 18 -8 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3" fill="none" stroke="#616161" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 18 8 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3 l 3 -3 l 3 3" fill="none" stroke="#616161" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#E3F2FD" />

  <!-- Juggling motion lines -->
  <path d="M 100 180 C 150 50, 250 50, 300 180" fill="none" stroke="#90A4AE" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>

  <!-- Penguin -->
  <g id="penguin" transform="translate(0, 20)">
    <!-- Body (Black part) -->
    <path d="M 200,165 C 130,165 120,220 120,260 C 120,330 150,350 200,350 C 250,350 280,330 280,260 C 280,220 270,165 200,165 Z" fill="#212121"/>
    
    <!-- Belly (White part) -->
    <ellipse cx="200" cy="255" rx="60" ry="80" fill="#FFFFFF"/>
    
    <!-- Eyes -->
    <circle cx="182" cy="180" r="12" fill="#FFFFFF"/>
    <circle cx="218" cy="180" r="12" fill="#FFFFFF"/>
    <circle cx="184" cy="178" r="5" fill="#212121"/>
    <circle cx="220" cy="178" r="5" fill="#212121"/>
    
    <!-- Beak -->
    <polygon points="200,190 220,205 200,205" fill="#FFC107"/>
    <polygon points="200,205 220,205 200,220" fill="#FFA000"/>

    <!-- Flippers (Arms) -->
    <path d="M 130 240 C 100 220, 100 180, 140 190 L 130 240 Z" fill="#212121"/>
    <path d="M 270 240 C 300 220, 300 180, 260 190 L 270 240 Z" fill="#212121"/>
    
    <!-- Feet -->
    <ellipse cx="170" cy="345" rx="25" ry="12" fill="#FFC107" transform="rotate(-15, 170, 345)"/>
    <ellipse cx="230" cy="345" rx="25" ry="12" fill="#FFC107" transform="rotate(15, 230, 345)"/>
  </g>
  
  <!-- The three juggling chainsaws -->
  <use href="#chainsaw" transform="translate(110, 150) rotate(-45)"/>
  <use href="#chainsaw" transform="translate(200, 70) rotate(15)"/>
  <use href="#chainsaw" transform="translate(290, 150) rotate(45)"/>

</svg>