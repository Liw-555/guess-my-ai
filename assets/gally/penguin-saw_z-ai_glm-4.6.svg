<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#E8F4F8"/>
  
  <!-- Motion lines background -->
  <g opacity="0.3">
    <path d="M50 100 Q100 90 150 100" stroke="#4A90E2" stroke-width="2" fill="none"/>
    <path d="M250 100 Q300 90 350 100" stroke="#4A90E2" stroke-width="2" fill="none"/>
    <path d="M150 80 Q200 70 250 80" stroke="#4A90E2" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Penguin Body -->
  <g id="penguin">
    <!-- Body -->
    <ellipse cx="200" cy="280" rx="65" ry="85" fill="#2C3E50"/>
    <!-- Belly -->
    <ellipse cx="200" cy="285" rx="50" ry="70" fill="white"/>
    <!-- Wings -->
    <ellipse cx="145" cy="270" rx="20" ry="45" fill="#2C3E50" transform="rotate(-25 145 270)"/>
    <ellipse cx="255" cy="270" rx="20" ry="45" fill="#2C3E50" transform="rotate(25 255 270)"/>
    <!-- Head -->
    <circle cx="200" cy="190" r="45" fill="#2C3E50"/>
    <!-- Face -->
    <ellipse cx="200" cy="195" rx="35" ry="32" fill="white"/>
    <!-- Eyes -->
    <circle cx="185" cy="185" r="8" fill="white"/>
    <circle cx="215" cy="185" r="8" fill="white"/>
    <circle cx="186" cy="186" r="5" fill="black"/>
    <circle cx="214" cy="186" r="5" fill="black"/>
    <!-- Beak -->
    <path d="M200 200 L190 210 L200 215 L210 210 Z" fill="#FFA500"/>
    <!-- Feet -->
    <ellipse cx="175" cy="355" rx="25" ry="15" fill="#FFA500"/>
    <ellipse cx="225" cy="355" rx="25" ry="15" fill="#FFA500"/>
  </g>
  
  <!-- Chainsaw 1 (left) -->
  <g transform="translate(120, 120) rotate(-30)">
    <rect x="0" y="0" width="8" height="40" fill="#8B4513"/>
    <rect x="-2" y="-25" width="12" height="30" fill="#696969"/>
    <rect x="-15" y="-20" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="-15" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="-10" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="-5" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="0" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="5" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="10" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="15" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="20" width="30" height="4" fill="#C0C0C0"/>
    <!-- Handle -->
    <rect x="-3" y="35" width="6" height="15" fill="#4A4A4A"/>
    <!-- Spark effect -->
    <circle cx="-18" cy="10" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Chainsaw 2 (center) -->
  <g transform="translate(200, 100) rotate(15)">
    <rect x="0" y="0" width="8" height="40" fill="#8B4513"/>
    <rect x="-2" y="-25" width="12" height="30" fill="#696969"/>
    <rect x="-15" y="-20" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="-15" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="-10" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="-5" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="0" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="5" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="10" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="15" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="20" width="30" height="4" fill="#C0C0C0"/>
    <!-- Handle -->
    <rect x="-3" y="35" width="6" height="15" fill="#4A4A4A"/>
    <!-- Spark effect -->
    <circle cx="18" cy="-5" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.5s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Chainsaw 3 (right) -->
  <g transform="translate(280, 120) rotate(45)">
    <rect x="0" y="0" width="8" height="40" fill="#8B4513"/>
    <rect x="-2" y="-25" width="12" height="30" fill="#696969"/>
    <rect x="-15" y="-20" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="-15" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="-10" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="-5" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="0" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="5" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="10" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="15" width="30" height="4" fill="#C0C0C0"/>
    <rect x="-15" y="20" width="30" height="4" fill="#C0C0C0"/>
    <!-- Handle -->
    <rect x="-3" y="35" width="6" height="15" fill="#4A4A4A"/>
    <!-- Spark effect -->
    <circle cx="18" cy="12" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Juggling motion trails -->
  <g opacity="0.4">
    <ellipse cx="120" cy="120" rx="3" ry="20" fill="#4A90E2" transform="rotate(-30 120 120)"/>
    <ellipse cx="200" cy="100" rx="3" ry="20" fill="#4A90E2" transform="rotate(15 200 100)"/>
    <ellipse cx="280" cy="120" rx="3" ry="20" fill="#4A90E2" transform="rotate(45 280 120)"/>
  </g>
  
  <!-- Ground shadow -->
  <ellipse cx="200" cy="370" rx="80" ry="15" fill="#000000" opacity="0.2"/>
</svg>